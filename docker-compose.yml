services:
  postgres:
    image: postgres:17
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ai_triage_test
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ai_triage_test"]
      interval: 2s
      timeout: 10s
      retries: 10

  elasticmq:
    image: softwaremill/elasticmq-native:1.6.11
    ports:
      - "127.0.0.1:9324:9324"
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro
