name: AI-Triage-Platform CI


on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch


permission:
  contents: read


jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
  
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: docker compose up -d --wait
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest
